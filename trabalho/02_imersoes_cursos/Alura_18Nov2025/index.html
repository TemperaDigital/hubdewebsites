        <h1>Base de Conhecimento de Linguagens de Programação</h1>

    <main>
        <!-- Seção de Busca -->
        <div id="busca-container">
            <input type="text" id="campo-busca" placeholder="Digite uma linguagem de programação (ex: JavaScript, Python, C#)">

        <!-- Área para Resultados/Conteúdo Principal -->
        <section id="resultados">
            <!-- Os cartões das linguagens serão inseridos aqui pelo JavaScript -->
