<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal SPC — Redirecionando...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                  url('https://imagens.fguerra.ia.br/logotipos/federal/faixaspc2.jpeg') center/cover no-repeat fixed;
      color: white;
      text-align: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.7);
      padding: 60px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
    }

    .message {
      font-size: 1.3em;
      margin-bottom: 40px;
      color: #e0e0e0;
      line-height: 1.6;
    }

    .redirect-link {
      display: inline-block;
      color: #4a9eff;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 2px solid #4a9eff;
      transition: all 0.3s ease;
    }

    .redirect-link:hover {
      color: #6bb3ff;
      border-bottom-color: #6bb3ff;
    }

    .countdown {
      font-size: 1.2em;
      margin-top: 30px;
      color: #ffb84d;
      font-weight: 600;
      min-height: 30px;
    }

    .countdown-number {
      font-size: 3em;
      font-weight: bold;
      color: #ffb84d;
      display: inline-block;
      min-width: 60px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #4a9eff;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 25px;
      }

      h1 {
        font-size: 1.8em;
      }

      .message {
        font-size: 1.1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Portal SPC</h1>
    <p class="message">
      Você está sendo redirecionado para<br>
      <strong style="color: #4a9eff;">SPCDIGITAL</strong>
    </p>

    <div class="spinner"></div>

    <div class="countdown">
      Redirecionando em <span class="countdown-number" id="countdown">5</span>s...
    </div>

    <p style="margin-top: 30px; font-size: 0.95em; color: #999;">
      Se não for redirecionado automaticamente,<br>
      <a href="https://spcdigital.fguerra.ia.br/" class="redirect-link">clique aqui para acessar</a>
    </p>
  </div>

  <script>
    let secondsRemaining = 5;
    const countdownElement = document.getElementById('countdown');

    // Atualizar contagem regressiva
    const countdownInterval = setInterval(() => {
      secondsRemaining--;
      countdownElement.textContent = secondsRemaining;

      if (secondsRemaining <= 0) {
        clearInterval(countdownInterval);
        // Redirecionar
        window.location.href = 'https://spcdigital.fguerra.ia.br/';
      }
    }, 1000);

    // Se o usuário clicar no link, fazer redirecionamento imediato
    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        clearInterval(countdownInterval);
        window.location.href = 'https://spcdigital.fguerra.ia.br/';
      });
    });
  </script>
</body>
</html>
