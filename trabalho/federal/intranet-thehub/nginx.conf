server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: todas as rotas caem no index (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # não cachear o config injetado em runtime
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location = /health {
    default_type text/plain;
    return 200 "ok";
  }
}
