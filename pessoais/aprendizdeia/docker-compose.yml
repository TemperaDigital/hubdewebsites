version: '3.8'

services:
  aprendiz-web:
    image: nginx:alpine
    container_name: aprendiz-web
    ports:
      - "8083:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - aprendiz-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  aprendiz-network:
    driver: bridge
