<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links & Bookmarks Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            100: '#e0ebff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            
            <!-- Brand & Title -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                        <i class="fa-solid fa-bookmark text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight tracking-tight text-slate-900 dark:text-white">Central de Links</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Gerenciador de favoritos e acessos rápidos</p>
                    </div>
                </div>

                <!-- Theme Toggle (Mobile) -->
                <button onclick="toggleTheme()" class="md:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none">
                    <i class="fa-solid fa-sun dark:hidden text-amber-500"></i>
                    <i class="fa-solid fa-moon hidden dark:block text-indigo-400"></i>
                </button>
            </div>

            <!-- Search, Action & Theme Bar -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <!-- Search Box -->
                <div class="relative flex-1 md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Buscar título, URL, tag..." 
                           class="w-full bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 rounded-xl pl-10 pr-8 py-2 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition">
                    <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>

                <!-- New Link Button -->
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-md shadow-indigo-500/20 flex items-center gap-2 whitespace-nowrap active:scale-95">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span class="hidden sm:inline">Novo Link</span>
                </button>

                <!-- Theme Toggle (Desktop) -->
                <button onclick="toggleTheme()" class="hidden md:flex p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid fa-sun dark:hidden text-amber-500"></i>
                    <i class="fa-solid fa-moon hidden dark:block text-indigo-400"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Category Pill Filters -->
        <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none" id="categoryFilterContainer">
            <!-- Rendered by JS -->
        </div>

        <!-- Links Cards Grid -->
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            <!-- Cards rendered dynamically via JS -->
        </div>

        <!-- Empty Results View -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800/80 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl border border-slate-200 dark:border-slate-700/50">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-700 dark:text-slate-200">Nenhum link encontrado</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1 max-w-xs mx-auto">Tente ajustar a busca ou adicionar um novo favorito.</p>
        </div>

    </main>

    <!-- Modal for Adding / Editing Links -->
    <div id="linkModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            
            <div class="flex justify-between items-center mb-5 border-b border-slate-100 dark:border-slate-800/80 pb-4">
                <div class="flex items-center gap-2.5">
                    <div id="modalIconBg" class="w-8 h-8 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                        <i class="fa-solid fa-link text-sm"></i>
                    </div>
                    <h3 id="modalTitle" class="text-base font-bold text-slate-900 dark:text-white">Adicionar Novo Link</h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="linkForm" onsubmit="handleSaveLink(event)" class="space-y-4">
                <input type="hidden" id="linkId">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Título *</label>
                    <input type="text" id="linkTitle" required placeholder="Ex: Cloudflare Tunnels" 
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">URL / Link Web *</label>
                    <input type="url" id="linkUrl" required placeholder="https://exemplo.com" 
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Categoria *</label>
                        <select id="linkCategory" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Rede / Servidor">Rede / Servidor</option>
                            <option value="Inspiração">Inspiração</option>
                            <option value="Desenvolvimento">Desenvolvimento</option>
                            <option value="Ferramentas">Ferramentas</option>
                            <option value="Geral">Geral</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Tags (separadas por vírgula)</label>
                        <input type="text" id="linkTags" placeholder="Cloudflare, VPN, Tunnel" 
                               class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Descrição (Opcional)</label>
                    <textarea id="linkDesc" rows="3" placeholder="Anotações rápidas sobre este recurso..." 
                              class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                </div>

                <div class="flex gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold py-2.5 rounded-xl text-sm transition">
                        Cancelar
                    </button>
                    <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md shadow-indigo-500/20">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i class="fa-solid fa-check-circle text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMessage">Ação concluída</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Default initial items requested by the user
        const defaultLinks = [
            {
                id: '1',
                title: 'Inspiração no Pinterest',
                url: 'https://pin.it/7wDzMRWay',
                category: 'Inspiração',
                tags: ['Design', 'Pinterest', 'Idéias'],
                desc: 'Coleção de quadros e referências estéticas para novos projetos.',
                createdAt: new Date().toISOString()
            },
            {
                id: '2',
                title: 'Cloudflare Tunnel Hostnames',
                url: 'https://dash.cloudflare.com/407e8b989690e9b82ce7b3ed4584310d/one/networks/connectors/cloudflare-tunnels/cloudflared/c09110dd-59df-472d-8d48-7bf5c33eaf3f/edit/public-hostname',
                category: 'Rede / Servidor',
                tags: ['Cloudflare', 'Tunnel', 'DNS', 'Hostnames'],
                desc: 'Painel de configuração de conectores e rotas públicas do Cloudflared.',
                createdAt: new Date().toISOString()
            }
        ];

        // App state
        let links = JSON.parse(localStorage.getItem('user_bookmarks_v1')) || defaultLinks;
        let activeCategory = 'Todos';
        let searchQuery = '';

        // Save data helper
        function saveLinks() {
            localStorage.setItem('user_bookmarks_v1', JSON.stringify(links));
        }

        // Favicon retriever helper
        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch {
                return 'https://via.placeholder.com/32';
            }
        }

        // Get domain name without protocol
        function getDisplayDomain(url) {
            try {
                return new URL(url).hostname.replace('www.', '');
            } catch {
                return url;
            }
        }

        // Category List Extraction
        function getCategories() {
            const categories = new Set(links.map(l => l.category));
            return ['Todos', ...Array.from(categories)];
        }

        // Render Filter Tabs
        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilterContainer');
            const categories = getCategories();

            container.innerHTML = categories.map(cat => {
                const isActive = cat === activeCategory;
                const activeClasses = 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20';
                const inactiveClasses = 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800';

                return `
                    <button onclick="setCategory('${cat}')" 
                            class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${isActive ? activeClasses : inactiveClasses}">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        // Render Link Cards Grid
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const emptyState = document.getElementById('emptyState');

            const filtered = links.filter(link => {
                const matchesCategory = activeCategory === 'Todos' || link.category === activeCategory;
                const query = searchQuery.toLowerCase();
                const matchesSearch = !query || 
                    link.title.toLowerCase().includes(query) ||
                    link.url.toLowerCase().includes(query) ||
                    (link.desc && link.desc.toLowerCase().includes(query)) ||
                    (link.tags && link.tags.some(tag => tag.toLowerCase().includes(query)));

                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            grid.innerHTML = filtered.map(link => {
                const tagsHtml = (link.tags || []).map(tag => `
                    <span class="px-2 py-0.5 text-[10px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-md border border-slate-200 dark:border-slate-700/60">
                        #${tag}
                    </span>
                `).join('');

                return `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-2xl p-5 hover:border-indigo-500/50 dark:hover:border-indigo-500/40 hover:shadow-xl hover:shadow-indigo-500/5 transition-all duration-200 flex flex-col justify-between group">
                        <div>
                            <!-- Header Info -->
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <span class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 rounded-lg border border-indigo-200 dark:border-indigo-900/40">
                                    ${link.category}
                                </span>
                                <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition">
                                    <button onclick="openModal('${link.id}')" title="Editar" class="p-1.5 text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-400 transition">
                                        <i class="fa-regular fa-pen-to-square text-xs"></i>
                                    </button>
                                    <button onclick="deleteLink('${link.id}')" title="Excluir" class="p-1.5 text-slate-400 hover:text-rose-500 transition">
                                        <i class="fa-regular fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Link Title and Icon -->
                            <div class="flex items-start gap-3 mb-2.5">
                                <img src="${getFaviconUrl(link.url)}" 
                                     onerror="this.src='https://via.placeholder.com/32'" 
                                     class="w-7 h-7 rounded-lg mt-0.5 p-0.5 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex-shrink-0 object-contain" 
                                     alt="Favicon">
                                <div>
                                    <h2 class="font-bold text-slate-800 dark:text-slate-100 text-sm group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition line-clamp-2">
                                        ${link.title}
                                    </h2>
                                    <span class="text-[11px] text-slate-400 dark:text-slate-500 font-mono line-clamp-1 mt-0.5">
                                        ${getDisplayDomain(link.url)}
                                    </span>
                                </div>
                            </div>

                            <!-- Description -->
                            ${link.desc ? `<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-3 leading-relaxed">${link.desc}</p>` : ''}

                            <!-- Tags -->
                            ${tagsHtml ? `<div class="flex flex-wrap gap-1 mb-4">${tagsHtml}</div>` : ''}
                        </div>

                        <!-- Card Footer -->
                        <div class="pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between gap-2 mt-auto">
                            <button onclick="copyToClipboard('${link.url}')" title="Copiar URL" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex items-center gap-1 transition">
                                <i class="fa-regular fa-copy text-xs"></i> Copiar
                            </button>
                            <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
                               class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-indigo-600 hover:text-white dark:hover:bg-indigo-600 dark:hover:text-white text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold transition-all">
                                Acessar <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter Actions
        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryFilters();
            renderCards();
        }

        function handleSearch() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value;
            document.getElementById('clearSearchBtn').classList.toggle('hidden', !searchQuery);
            renderCards();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderCards();
        }

        // Modal Control
        function openModal(id = null) {
            const modal = document.getElementById('linkModal');
            const form = document.getElementById('linkForm');
            const title = document.getElementById('modalTitle');

            form.reset();

            if (id) {
                const link = links.find(l => l.id === id);
                if (link) {
                    title.textContent = 'Editar Link';
                    document.getElementById('linkId').value = link.id;
                    document.getElementById('linkTitle').value = link.title;
                    document.getElementById('linkUrl').value = link.url;
                    document.getElementById('linkCategory').value = link.category;
                    document.getElementById('linkTags').value = (link.tags || []).join(', ');
                    document.getElementById('linkDesc').value = link.desc || '';
                }
            } else {
                title.textContent = 'Adicionar Novo Link';
                document.getElementById('linkId').value = '';
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('linkModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Save (Add or Update) Link
        function handleSaveLink(e) {
            e.preventDefault();
            const id = document.getElementById('linkId').value;
            const title = document.getElementById('linkTitle').value.trim();
            const url = document.getElementById('linkUrl').value.trim();
            const category = document.getElementById('linkCategory').value;
            const tagsRaw = document.getElementById('linkTags').value;
            const desc = document.getElementById('linkDesc').value.trim();

            const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

            if (id) {
                // Update
                const index = links.findIndex(l => l.id === id);
                if (index !== -1) {
                    links[index] = { ...links[index], title, url, category, tags, desc };
                    showToast('Link atualizado com sucesso!');
                }
            } else {
                // Create
                const newLink = {
                    id: Date.now().toString(),
                    title,
                    url,
                    category,
                    tags,
                    desc,
                    createdAt: new Date().toISOString()
                };
                links.unshift(newLink);
                showToast('Novo link salvo!');
            }

            saveLinks();
            renderCategoryFilters();
            renderCards();
            closeModal();
        }

        // Delete Link
        function deleteLink(id) {
            links = links.filter(l => l.id !== id);
            saveLinks();
            renderCategoryFilters();
            renderCards();
            showToast('Link removido');
        }

        // Copy URL
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('URL copiada para a área de transferência!');
        }

        // Toast Feedback
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Theme Toggle (Dark / Light)
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Init Theme
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();

        // Initial setup on load
        window.onload = function() {
            renderCategoryFilters();
            renderCards();
        };
    </script>
</body>
</html>
